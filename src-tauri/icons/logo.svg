    <linearGradient id="nod-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="232" fill="url(#nod-bg)"/>
  <circle cx="340" cy="372" r="88" fill="#ffffff"/>
  <path d="M360 556 L462 658 L650 448" fill="none" stroke="#ffffff" stroke-width="100" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="706" cy="386" r="86" fill="url(#nod-bg)" stroke="#ffffff" stroke-width="56"/>
</svg>
