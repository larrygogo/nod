name: release

# Push a tag like v0.1.0 to build the installers for every platform and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: "--bundles nsis" }
          - { os: macos-latest, args: "--bundles app,dmg --target aarch64-apple-darwin", target: aarch64-apple-darwin }
          - { os: macos-latest, args: "--bundles app,dmg --target x86_64-apple-darwin", target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, args: "--bundles appimage,deb" }
          - { os: ubuntu-22.04-arm, args: "--bundles appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build   # the app embeds the built window
      - run: cargo test
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: src-tauri
      - run: bunx tauri build ${{ matrix.args }}
      - name: collect
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target -path '*/bundle/*' \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec cp {} out/ \;
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: nod-${{ matrix.os }}-${{ matrix.target || 'native' }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: (cd assets && sha256sum * > SHA256SUMS)
      - name: release notes from CHANGELOG
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
